<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lauretta e il Naviglio della Martesana</title>
  <script type="text/javascript">
    const debugMode = false;
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
      /* Sfondo scuro in tonalità legno/pergamena per richiamare le cornici della mappa */
      background: #2a1f18;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .map-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      gap: clamp(10px, 1.8vw, 24px);
      align-items: center;
      padding: clamp(12px, 2vw, 24px);
      overflow: hidden;
      background: radial-gradient(circle at center, #3d2d22 0%, #1a120e 100%);
    }

    /* SFONDO SFUMATO ELEGANTE: Effetto morbido basato sui toni caldi della mappa */
    .bg-blur {
      position: absolute;
      inset: -40px;
      background-image: url('base.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(45px) brightness(0.6) saturate(0.8);
      opacity: 0.85;
      z-index: 1;
    }

    .map-area {
      display: grid;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      place-items: center;
    }

    /* Contenitore mappa: mantiene le proporzioni e mostra l'immagine COMPLETA */
    .map {
      position: relative;
      z-index: 2;
      width: min(100%, calc((100dvh - 48px) * 1.5238));
      aspect-ratio: 1024 / 672;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
    }

    .photo-rail {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 0 0 clamp(76px, 9vw, 116px);
      flex-direction: column;
      gap: 10px;
      height: 100%;
      min-height: 0;
      color: #fff;
    }

    .photo-rail-title {
      flex: 0 0 auto;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
      text-align: center;
    }

    .photo-rail-list {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: rgba(255,255,255,.55) rgba(255,255,255,.12);
      scrollbar-width: thin;
    }

    .photo-thumbnail {
      flex: 0 0 auto;
      width: 100%;
      border: 2px solid rgba(255,255,255,.32);
      border-radius: 8px;
      padding: 0;
      overflow: hidden;
      background: rgba(0,0,0,.4);
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: border-color .18s ease, transform .18s ease;
    }

    .photo-thumbnail:hover,
    .photo-thumbnail:focus-visible {
      border-color: #fff;
      transform: translateY(-1px);
    }

    .photo-thumbnail:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .photo-thumbnail[aria-current="true"] {
      border-color: #f3bb64;
      box-shadow: 0 0 0 1px #f3bb64;
    }

    .photo-thumbnail img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .photo-thumbnail-title {
      display: block;
      padding: 5px 6px;
      overflow: hidden;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .map-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .map-load-error {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      margin: 0;
      padding: 12px 16px;
      border-radius: 8px;
      background: #fff;
      color: #8b1728;
      text-align: center;
    }

    .placemark {
      --size: clamp(20px, 3.2vw, 32px);
      position: absolute;
      width: var(--size);
      height: var(--size);
      transform: translate(-50%, -50%);
      border: 0;
      padding: 0;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      z-index: 5;
    }

    .placemark::before,
    .placemark::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(220, 44, 64, .32);
      animation: pulse 2s ease-out infinite;
    }

    .placemark::after {
      animation-delay: 1s;
    }

    .placemark-dot {
      position: absolute;
      inset: 25%;
      border-radius: 50%;
      background: #d9273f;
      border: 3px solid #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,.35);
      z-index: 2;
      transition: transform .18s ease, background .18s ease;
    }

    .placemark:hover .placemark-dot,
    .placemark:focus-visible .placemark-dot {
      transform: scale(1.12);
      background: #b71931;
    }

    .placemark:focus-visible {
      outline: none;
    }

    .placemark:focus-visible .placemark-dot {
      box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 4px 12px rgba(0,0,0,.35);
    }

    .placemark-label {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 2px);
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 7px 11px;
      border-radius: 8px;
      background: rgba(18, 24, 30, .88);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .placemark:hover .placemark-label,
    .placemark:focus-visible .placemark-label {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    @keyframes pulse {
      0% { transform: scale(.55); opacity: .8; }
      70% { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fullscreen-close {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
    }

    .fullscreen-close:hover { background: rgba(0,0,0,.72); }

    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: max(20px, env(safe-area-inset-top)) max(68px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(68px, env(safe-area-inset-left));
      background: rgba(7, 10, 12, .9);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .2s ease, visibility .2s ease;
      z-index: 40;
    }

    .fullscreen-content {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-height: 92vh;
    }

    .fullscreen-content.loading .fullscreen-info {
      visibility: hidden;
    }

    .fullscreen-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .fullscreen-nav {
      position: absolute;
      top: 50%;
      width: 48px;
      height: 48px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
    }

    .fullscreen-nav:hover { background: rgba(0,0,0,.78); }
    .fullscreen-prev { left: 18px; }
    .fullscreen-next { right: 18px; }

    .fullscreen-image {
      display: block;
      width: 100%;
      max-height: 92dvh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
      cursor: zoom-out;
      transition: opacity .2s ease;
    }

    .fullscreen-image-frame {
      position: relative;
      display: grid;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 200px;
      max-height: 92dvh;
      place-items: center;
    }

    .fullscreen-image-frame.loading .fullscreen-image {
      opacity: 0;
    }

    .fullscreen-loader {
      position: absolute;
      display: none;
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .fullscreen-image-frame.loading .fullscreen-loader {
      display: block;
    }

    .fullscreen-info {
      flex: 0 0 clamp(220px, 22vw, 320px);
      max-height: 92dvh;
      overflow-y: auto;
      color: #fff;
    }

    .fullscreen-title {
      margin: 0 0 14px;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.15;
    }

    .fullscreen-description {
      margin: 0;
      color: rgba(255,255,255,.82);
      font-size: 16px;
      line-height: 1.65;
      white-space: pre-line;
    }

    @media (max-width: 700px) {
      .map-screen {
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }

      .map-area {
        width: 100%;
      }

      .map {
        width: min(100%, calc((100dvh - 150px) * 1.5238));
      }

      .photo-rail {
        flex: 0 0 clamp(72px, 14vh, 100px);
        width: 100%;
        height: auto;
        gap: 6px;
      }

      .photo-rail-title {
        font-size: 12px;
      }

      .photo-rail-list {
        flex-direction: row;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 2px 2px 6px;
      }

      .photo-thumbnail {
        flex: 0 0 clamp(64px, 17vw, 88px);
        width: auto;
      }

      .photo-thumbnail-title {
        padding: 4px;
        font-size: 9px;
      }

      .fullscreen-overlay {
        padding: max(56px, env(safe-area-inset-top)) 56px max(12px, env(safe-area-inset-bottom));
      }
      .fullscreen-content {
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        height: auto;
        max-height: calc(100vh - 80px);
      }
      .fullscreen-image {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 58vh;
      }
      .fullscreen-image-frame {
        flex: 0 1 auto;
        width: 100%;
        min-height: 0;
        height: auto;
        max-height: 58vh;
      }
      .fullscreen-info {
        flex: 0 0 auto;
        width: 100%;
        max-height: 26%;
      }
      .fullscreen-prev { left: max(8px, env(safe-area-inset-left)); }
      .fullscreen-next { right: max(8px, env(safe-area-inset-right)); }
    }

    @media (max-width: 380px) {
      .fullscreen-overlay { padding-right: 48px; padding-left: 48px; }
      .fullscreen-info { font-size: 14px; }
      .fullscreen-description { font-size: 14px; }
      .fullscreen-title { font-size: 22px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .fullscreen-overlay {
        padding-top: max(8px, env(safe-area-inset-top));
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
      .fullscreen-close { top: max(8px, env(safe-area-inset-top)); }
      .fullscreen-content {
        max-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
    }

    @supports (height: 100dvh) {
      .fullscreen-content { max-height: 92dvh; }
      @media (max-width: 700px) {
        .fullscreen-content {
          max-height: calc(100dvh - 80px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .placemark::before, .placemark::after { animation: none; }
      .placemark-dot, .fullscreen-image, .photo-thumbnail { transition: none; }
      .fullscreen-loader { animation: none; }
    }
  </style>
</head>
<body>
  <main class="map-screen" aria-label="Mappa interattiva">
    <div class="bg-blur"></div>
    <div class="map-area">
      <div class="map">
        <img class="map-image" src="base.jpeg" alt="Lauretta e il Naviglio della Martesana" />
      </div>
    </div>
    <nav class="photo-rail" aria-label="Foto della mappa">
      <h2 class="photo-rail-title">Foto</h2>
      <div class="photo-rail-list" id="photo-rail-list"></div>
    </nav>
  </main>

  <div class="fullscreen-overlay" id="fullscreen-overlay" role="dialog" aria-modal="true"
       aria-labelledby="fullscreen-title" aria-describedby="fullscreen-description" aria-hidden="true">
    <button class="fullscreen-close" id="fullscreen-close" aria-label="Chiudi vista a schermo intero">×</button>
    <button class="fullscreen-nav fullscreen-prev" id="fullscreen-prev" type="button" aria-label="Foto precedente">‹</button>
    <div class="fullscreen-content">
      <div class="fullscreen-image-frame" id="fullscreen-image-frame">
        <span class="fullscreen-loader" role="status" aria-label="Caricamento foto"></span>
        <img class="fullscreen-image" id="fullscreen-image" alt="" />
      </div>
      <div class="fullscreen-info">
        <h2 class="fullscreen-title" id="fullscreen-title"></h2>
        <p class="fullscreen-description" id="fullscreen-description"></p>
      </div>
    </div>
    <button class="fullscreen-nav fullscreen-next" id="fullscreen-next" type="button" aria-label="Foto successiva">›</button>
  </div>

  <script>
    const map = document.querySelector(".map");
    const fullscreenOverlay = document.getElementById("fullscreen-overlay");
    const fullscreenContent = document.querySelector(".fullscreen-content");
    const fullscreenImageFrame = document.getElementById("fullscreen-image-frame");
    const fullscreenImage = document.getElementById("fullscreen-image");
    const fullscreenTitle = document.getElementById("fullscreen-title");
    const fullscreenDescription = document.getElementById("fullscreen-description");
    const fullscreenClose = document.getElementById("fullscreen-close");
    const fullscreenPrev = document.getElementById("fullscreen-prev");
    const fullscreenNext = document.getElementById("fullscreen-next");
    const photoRailList = document.getElementById("photo-rail-list");
    let photoTriggers = [];
    let photoThumbnails = [];

    let lastTrigger = null;
    let returnFocusTarget = null;
    let fullscreenIndex = -1;
    let fullscreenImageRequest = 0;

    if (debugMode) {
      map.addEventListener("click", (event) => {
        if (event.target.closest(".placemark")) return;
        const bounds = map.getBoundingClientRect();
        const left = ((event.clientX - bounds.left) / bounds.width * 100).toFixed(1);
        const top = ((event.clientY - bounds.top) / bounds.height * 100).toFixed(1);
        alert(`left: ${left}%; top: ${top}%;`);
      });
    }

    function openFullscreen(trigger, focusTarget = trigger) {
      lastTrigger = trigger;
      returnFocusTarget = focusTarget;
      fullscreenIndex = photoTriggers.indexOf(lastTrigger);
      updateFullscreenContent(lastTrigger);
      fullscreenOverlay.classList.add("open");
      fullscreenOverlay.setAttribute("aria-hidden", "false");
      fullscreenClose.focus();
    }

    function updateFullscreenContent(trigger) {
      const request = ++fullscreenImageRequest;
      fullscreenContent.classList.add("loading");
      fullscreenImageFrame.classList.add("loading");
      fullscreenImageFrame.setAttribute("aria-busy", "true");
      fullscreenImage.alt = trigger.dataset.title || "Foto";
      const selectedIndex = photoTriggers.indexOf(trigger);
      photoThumbnails.forEach((thumbnail, index) => {
        if (index === selectedIndex) {
          thumbnail.setAttribute("aria-current", "true");
        } else {
          thumbnail.removeAttribute("aria-current");
        }
      });

      const finishLoading = () => {
        if (request !== fullscreenImageRequest) return;
        fullscreenContent.classList.remove("loading");
        fullscreenImageFrame.classList.remove("loading");
        fullscreenImageFrame.removeAttribute("aria-busy");
        fullscreenTitle.textContent = trigger.dataset.title || "";
        fullscreenDescription.textContent = trigger.dataset.description || "";
      };
      fullscreenImage.onload = finishLoading;
      fullscreenImage.onerror = finishLoading;
      fullscreenImage.src = trigger.dataset.image || "";
    }

    function showFullscreenPhoto(direction) {
      if (fullscreenIndex < 0 || photoTriggers.length < 2) return;
      fullscreenIndex = (fullscreenIndex + direction + photoTriggers.length) % photoTriggers.length;
      lastTrigger = photoTriggers[fullscreenIndex];
      updateFullscreenContent(lastTrigger);
    }

    function closeFullscreen() {
      fullscreenOverlay.classList.remove("open");
      fullscreenOverlay.setAttribute("aria-hidden", "true");
      fullscreenImageRequest += 1;
      fullscreenContent.classList.remove("loading");
      fullscreenImage.onload = null;
      fullscreenImage.onerror = null;
      fullscreenImageFrame.classList.remove("loading");
      fullscreenImageFrame.removeAttribute("aria-busy");
      fullscreenImage.src = "";
      fullscreenImage.alt = "";
      fullscreenTitle.textContent = "";
      fullscreenDescription.textContent = "";
      if (returnFocusTarget) returnFocusTarget.focus();
      returnFocusTarget = null;
    }

    function loadMapPoints() {
      const points = JSON.parse(document.getElementById("map-points-data").textContent);
      if (!Array.isArray(points)) {
        throw new Error("I dati dei punti devono essere un array JSON.");
      }

      points.forEach((point, index) => {
        if (
          !point ||
          typeof point.title !== "string" ||
          typeof point.description !== "string" ||
          typeof point.image !== "string" ||
          !point.image ||
          !Number.isFinite(point.left) ||
          !Number.isFinite(point.top) ||
          point.left < 0 ||
          point.left > 100 ||
          point.top < 0 ||
          point.top > 100
        ) {
          throw new Error(`Dati non validi per il punto ${index + 1}.`);
        }

        const trigger = document.createElement("button");
        trigger.type = "button";
        trigger.className = "placemark";
        trigger.style.left = `${point.left}%`;
        trigger.style.top = `${point.top}%`;
        trigger.dataset.title = point.title;
        trigger.dataset.description = point.description;
        trigger.dataset.image = point.image;

        const label = document.createElement("span");
        label.className = "placemark-label";
        label.textContent = point.title;
        const dot = document.createElement("span");
        dot.className = "placemark-dot";
        trigger.append(label, dot);
        map.append(trigger);
      });

      photoTriggers = Array.from(map.querySelectorAll(".placemark[data-image]"));
      photoThumbnails = photoTriggers.map((trigger, index) => {
        const thumbnail = document.createElement("button");
        thumbnail.type = "button";
        thumbnail.className = "photo-thumbnail";
        thumbnail.setAttribute("aria-label", `Apri foto: ${trigger.dataset.title || `Foto ${index + 1}`}`);
        thumbnail.title = trigger.dataset.title || "";

        const image = document.createElement("img");
        image.src = trigger.dataset.image;
        image.alt = "";
        image.loading = "lazy";
        image.decoding = "async";

        const title = document.createElement("span");
        title.className = "photo-thumbnail-title";
        title.textContent = trigger.dataset.title || "";

        thumbnail.append(image, title);
        thumbnail.addEventListener("click", () => openFullscreen(trigger, thumbnail));
        photoRailList.append(thumbnail);
        return thumbnail;
      });
    }

    try {
      loadMapPoints();
      document.querySelectorAll(".placemark").forEach((trigger) => {
        trigger.addEventListener("click", (event) => {
          event.preventDefault();
          openFullscreen(trigger);
        });
      });

      fullscreenImage.addEventListener("click", closeFullscreen);
      fullscreenOverlay.addEventListener("click", (event) => {
        if (event.target === fullscreenOverlay) {
          closeFullscreen();
        }
      });
      fullscreenClose.addEventListener("click", closeFullscreen);
      fullscreenPrev.addEventListener("click", () => showFullscreenPhoto(-1));
      fullscreenNext.addEventListener("click", () => showFullscreenPhoto(1));

      document.addEventListener("keydown", (event) => {
        if (fullscreenOverlay.classList.contains("open")) {
          if (event.key === "ArrowRight") {
            showFullscreenPhoto(1);
            return;
          }
          if (event.key === "ArrowLeft") {
            showFullscreenPhoto(-1);
            return;
          }
        }

        if (event.key === "Escape") {
          if (fullscreenOverlay.classList.contains("open")) {
            closeFullscreen();
          }
        }
      });
    } catch (error) {
      console.error("Impossibile inizializzare i punti della mappa.", error);
      const loadError = document.createElement("p");
      loadError.className = "map-load-error";
      loadError.setAttribute("role", "alert");
      loadError.textContent = "I dati dei punti della mappa non sono validi. Controlla il JSON incorporato nella pagina.";
      map.append(loadError);
    }
  </script>
