<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lauretta e il Naviglio della Martesana</title>
  <script type="text/javascript">
    const debugMode = true;
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
      /* Sfondo scuro in tonalità legno/pergamena per richiamare le cornici della mappa */
      background: #2a1f18;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .map-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #3d2d22 0%, #1a120e 100%);
    }

    /* SFONDO SFUMATO ELEGANTE: Effetto morbido basato sui toni caldi della mappa */
    .bg-blur {
      position: absolute;
      inset: -40px;
      background-image: url('base.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(45px) brightness(0.6) saturate(0.8);
      opacity: 0.85;
      z-index: 1;
    }

    /* Contenitore mappa: mantiene le proporzioni e mostra l'immagine COMPLETA */
    .map {
      position: relative;
      z-index: 2;
      width: min(100vw, 152.38vh);
      height: min(100vh, 65.62vw);
      aspect-ratio: 1024 / 672;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
    }

    .map-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .placemark {
      --size: clamp(20px, 3.2vw, 32px);
      position: absolute;
      width: var(--size);
      height: var(--size);
      transform: translate(-50%, -50%);
      border: 0;
      padding: 0;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      z-index: 5;
    }

    .placemark::before,
    .placemark::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(220, 44, 64, .32);
      animation: pulse 2s ease-out infinite;
    }

    .placemark::after {
      animation-delay: 1s;
    }

    .placemark-dot {
      position: absolute;
      inset: 25%;
      border-radius: 50%;
      background: #d9273f;
      border: 3px solid #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,.35);
      z-index: 2;
      transition: transform .18s ease, background .18s ease;
    }

    .placemark:hover .placemark-dot,
    .placemark:focus-visible .placemark-dot {
      transform: scale(1.12);
      background: #b71931;
    }

    .placemark:focus-visible {
      outline: none;
    }

    .placemark:focus-visible .placemark-dot {
      box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 4px 12px rgba(0,0,0,.35);
    }

    .placemark-label {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 2px);
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 7px 11px;
      border-radius: 8px;
      background: rgba(18, 24, 30, .88);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .placemark:hover .placemark-label,
    .placemark:focus-visible .placemark-label {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    @keyframes pulse {
      0% { transform: scale(.55); opacity: .8; }
      70% { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 16, .34);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      z-index: 10;
    }

    .backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .popup {
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      width: min(92vw, 430px);
      max-height: min(86vh, 700px);
      overflow: hidden;
      transform: translate(-50%, -46%) scale(.96);
      opacity: 0;
      pointer-events: none;
      background: rgba(255,255,255,.98);
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      transition: transform .22s ease, opacity .22s ease;
      padding: 0;
    }

    .popup.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .popup-image-frame {
      position: relative;
      display: grid;
      min-height: 190px;
      max-height: 50vh;
      overflow: hidden;
      place-items: center;
      background: #f4efe9;
    }

    .popup-nav {
      position: absolute;
      top: 50%;
      display: grid;
      width: 40px;
      height: 40px;
      transform: translateY(-50%);
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      z-index: 3;
    }

    .popup-nav:hover { background: rgba(0,0,0,.78); }
    .popup-prev { left: 10px; }
    .popup-next { right: 10px; }

    .popup-image-frame.loading .popup-image { opacity: 0; }

    .popup-loader {
      position: absolute;
      display: none;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(217, 39, 63, .2);
      border-top-color: #d9273f;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .popup-image-frame.loading .popup-loader { display: block; }

    .popup-image {
      display: block;
      width: 100%;
      max-height: 50vh;
      height: auto;
      object-fit: cover;
      object-position: center;
      cursor: zoom-in;
      transition: opacity .2s ease;
      image-rendering: auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .popup-content {
      padding: 18px 18px 22px;
      overflow: hidden;
    }

    .popup-kicker {
      margin: 0 0 6px;
      color: #d9273f;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .popup-title {
      margin: 0 42px 10px 0;
      color: #15191d;
      font-size: 26px;
      line-height: 1.1;
    }

    .popup-description {
      margin: 0;
      color: #555e66;
      font-size: 15px;
      line-height: 1.6;
    }

    .popup-close,
    .fullscreen-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
    }

    .popup-close:hover,
    .fullscreen-close:hover { background: rgba(0,0,0,.72); }

    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px 68px;
      background: rgba(7, 10, 12, .9);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .2s ease, visibility .2s ease;
      z-index: 40;
    }

    .fullscreen-content {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-height: 92vh;
    }

    .fullscreen-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .fullscreen-nav {
      position: absolute;
      top: 50%;
      width: 44px;
      height: 44px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
    }

    .fullscreen-nav:hover { background: rgba(0,0,0,.78); }
    .fullscreen-prev { left: 18px; }
    .fullscreen-next { right: 18px; }

    .fullscreen-image {
      flex: 1 1 auto;
      min-width: 0;
      max-width: none;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
      cursor: zoom-out;
    }

    .fullscreen-info {
      flex: 0 0 clamp(220px, 22vw, 320px);
      max-height: 92vh;
      overflow-y: auto;
      color: #fff;
    }

    .fullscreen-title {
      margin: 0 0 14px;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.15;
    }

    .fullscreen-description {
      margin: 0;
      color: rgba(255,255,255,.82);
      font-size: 16px;
      line-height: 1.65;
      white-space: pre-line;
    }

    @media (max-width: 600px) {
      .popup-image { height: 190px; }
      .popup-content { padding: 18px; }
      .popup-title { font-size: 23px; }
      .fullscreen-overlay { padding: 64px 16px 20px; }
      .fullscreen-content {
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        max-height: none;
      }
      .fullscreen-image {
        flex: 0 1 auto;
        max-width: 100%;
        max-height: 62vh;
      }
      .fullscreen-info {
        flex: 0 1 auto;
        width: 100%;
        max-height: 24vh;
      }
      .fullscreen-prev { left: 8px; }
      .fullscreen-next { right: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .placemark::before, .placemark::after { animation: none; }
      .popup, .backdrop, .placemark-dot, .popup-image { transition: none; }
      .popup-loader { animation: none; }
    }
  </style>
</head>
<body>
  <main class="map-screen" aria-label="Mappa interattiva">
    <div class="bg-blur"></div>
    <div class="map">
      <img class="map-image" src="base.jpeg" alt="Lauretta e il Naviglio della Martesana" />

      <button type="button" class="placemark" style="left: 95.6%; top: 11.9%;"
              data-title="KM 0"
              data-kicker="Punto di interesse"
              data-description="Proprio in questo punto, da una chiusa sul fiume Adda, nasce il Naviglio della Martesana... e da qui comincia la mia pedalata!"
              data-image="./foto/00.jpg">
        <span class="placemark-label">KM 0</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 96.5%; top: 16.5%;"
              data-title="KM 1"
              data-kicker="Punto di interesse"
              data-description="Qui siamo a Concesa, abbiamo da poco superato il Santuario ed il ponticello che porta a Crespi d'Adda"
              data-image="./foto/01.jpg">
        <span class="placemark-label">KM 1</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 96.8%; top: 21%;"
              data-title="KM 2"
              data-kicker="Punto di interesse"
              data-description="Secondo chilometro, siamo a Vaprio d'Adda. Alle mie spalle vedete il vecchio mulino sotto la Villa Castelbarco"
              data-image="./foto/02.jpg">
        <span class="placemark-label">KM 2</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 98%; top: 25%;"
              data-title="KM 3"
              data-kicker="Punto di interesse"
              data-description="Qui finisce il primo pezzo di argine. Sono arrivata al ponte sull'Adda che unisce Vaprio (MI) e Canonica (BG)"
              data-image="./foto/03.jpg">
        <span class="placemark-label">KM 3</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 95.5%; top: 31.4%;"
              data-title="KM 4"
              data-kicker="Punto di interesse"
              data-description="Ho fatto un pezzo di strada dove passavano anche le macchine, ma ho ammirato la scala &quot;Vortice di Leonardo&quot; e la Casa del custode delle acque, dove sono stata anche in gita con la scuola! Ho visto una torre che sembra quella di un castello, il parco di Gioia ed eccomi qui, al chilometro 4, di nuovo sulla ciclabile."
              data-image="./foto/04.jpg">
        <span class="placemark-label">KM 4</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 95%; top: 34.9%;"
              data-title="KM 5"
              data-kicker="Punto di interesse"
              data-description="Continuo la mia pedalata. Da queste parti c'è una piccola diga e una centrale elettrica nascosta!"
              data-image="./foto/05.jpg">
        <span class="placemark-label">KM 5</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 94.1%; top: 40.9%;"
              data-title="KM 7"
              data-kicker="Punto di interesse"
              data-description="Sono arrivata al chilometro 7! Ma dov'è finito il cartello del km 6!? Forse con l'erba alta ai lati della pista non l'ho visto."
              data-image="./foto/07.jpg">
        <span class="placemark-label">KM 7</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 94.8%; top: 44%;"
              data-title="Salt dal Gatt"
              data-kicker="Punto di interesse"
              data-description="Chi conosce il &quot;Villoresi&quot;? Per chi non ne ha mai sentito parlare, è un canale artificiale che parte dal Ticino, è stato realizzato per per irrigare le terre della pianura lombarda e, dopo 86 chilometri, sfocia proprio qui!"
              data-image="./foto/Villoresi.jpg">
        <span class="placemark-label">Salt dal Gatt</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 94.9%; top: 46.3%;"
              data-title="Rudun"
              data-kicker="Punto di interesse"
              data-description="Sono arrivata a Groppello! Vecchio lavatoio, &quot;Rudun&quot; (il mulino alle mie spalle) e pausa gelato!"
              data-image="./foto/Rudun.jpg">
        <span class="placemark-label">Rudun</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 93.1%; top: 54%;"
              data-title="KM 9"
              data-kicker="Punto di interesse"
              data-description="Qui il Naviglio procede verso Ovest e saluta il fiume Adda. Proprio dove fa la curva, potete vedere il ponte &quot;autoportante di Leonardo da Vinci&quot;"
              data-image="./foto/09.jpg">
        <span class="placemark-label">KM 9</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 89.7%; top: 53.1%;"
            data-title="KM 10"
            data-kicker="Punto di interesse"
            data-description="Oggi altra tappa, papà ha parcheggiato l'auto vicino al ponte di Leonardo e ora procedo verso Milano, ma mi fermerò prima sicuramente!"
            data-image="./foto/10.jpg">
        <span class="placemark-label">KM 10</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 86.0%; top: 51.0%;"
              data-title="KM 11"
              data-kicker="Punto di interesse"
              data-description="Mi trovo tra Cassano e Inzago. Sto pedalando tra campi e cascine."
              data-image="./foto/11.jpg">
        <span class="placemark-label">KM 11</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 84.1%; top: 46.4%;"
              data-title="Inzago: La festa del paese"
              data-kicker="Punto di interesse"
              data-description="Piccola deviazione! Oggi a Inzago c'è la festa del paese! Ho fatto una pausa per ammirare le bancarelle, ricaricarmi con un pezzo di torrone e provare ad indovinare il peso del bue che vedete alle mie spalle!"
              data-image="./foto/Festa.jpg">
        <span class="placemark-label">Inzago: La festa del paese</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 79.3%; top: 48.7%;"
            data-title="KM 13"
            data-kicker="Punto di interesse"
            data-description="Ho superato il centro di Inzago, procedo verso Milano!"
            data-image="./foto/13.jpg">
        <span class="placemark-label">KM 13</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 77.1%; top: 47.3%;"
              data-title="KM 14"
              data-kicker="Punto di interesse"
              data-description="Sono arrivata al chilometro 14! Davanti a me vedo il centro commerciale &quot;La Corte Lombarda&quot;... Potremmo fermarci per fare shopping, ma io preferisco pedalare ancora un po'!"
              data-image="./foto/14.jpg">
        <span class="placemark-label">KM 14</span>
        <span class="placemark-dot"></span>
      </button>

      <button type="button" class="placemark" style="left: 74.2%; top: 47.7%;"
            data-title="KM 15"
            data-kicker="Punto di interesse"
            data-description="Ma che carina la casetta alle mie spalle! Sembra un piccolo cottage immerso nel verde, con il tetto spiovente e le finestre colorate. Mi fermo un attimo per ammirarla e scattare una foto! Per oggi mi fermo qui, al chilometro 15, ma tornerò presto per continuare la mia pedalata lungo il Naviglio della Martesana!"
            data-image="./foto/15.jpg">
        <span class="placemark-label">KM 15</span>
        <span class="placemark-dot"></span>
      </button>



    </div>
  </main>

  <div class="backdrop" id="backdrop"></div>

  <section class="popup" id="popup" role="dialog" aria-modal="true"
           aria-labelledby="popup-title" aria-describedby="popup-description">
    <button class="popup-close" id="popup-close" aria-label="Chiudi">×</button>
    <div class="popup-image-frame" id="popup-image-frame">
      <span class="popup-loader" role="status" aria-label="Caricamento foto"></span>
      <button class="popup-nav popup-prev" id="popup-prev" type="button" aria-label="Foto precedente">‹</button>
      <img class="popup-image" id="popup-image" alt="" />
      <button class="popup-nav popup-next" id="popup-next" type="button" aria-label="Foto successiva">›</button>
    </div>
    <div class="popup-content">
      <p class="popup-kicker" id="popup-kicker"></p>
      <h2 class="popup-title" id="popup-title"></h2>
      <p class="popup-description" id="popup-description"></p>
    </div>
  </section>

  <div class="fullscreen-overlay" id="fullscreen-overlay" role="dialog" aria-modal="true"
       aria-labelledby="fullscreen-title" aria-describedby="fullscreen-description" aria-hidden="true">
    <button class="fullscreen-close" id="fullscreen-close" aria-label="Chiudi vista a schermo intero">×</button>
    <button class="fullscreen-nav fullscreen-prev" id="fullscreen-prev" type="button" aria-label="Foto precedente">‹</button>
    <div class="fullscreen-content">
      <img class="fullscreen-image" id="fullscreen-image" alt="" />
      <div class="fullscreen-info">
        <h2 class="fullscreen-title" id="fullscreen-title"></h2>
        <p class="fullscreen-description" id="fullscreen-description"></p>
      </div>
    </div>
    <button class="fullscreen-nav fullscreen-next" id="fullscreen-next" type="button" aria-label="Foto successiva">›</button>
  </div>

  <script>
    const popup = document.getElementById("popup");
    const backdrop = document.getElementById("backdrop");
    const map = document.querySelector(".map");
    const closeButton = document.getElementById("popup-close");
    const popupImage = document.getElementById("popup-image");
    const popupImageFrame = document.getElementById("popup-image-frame");
    const popupPrev = document.getElementById("popup-prev");
    const popupNext = document.getElementById("popup-next");
    const popupKicker = document.getElementById("popup-kicker");
    const popupTitle = document.getElementById("popup-title");
    const popupDescription = document.getElementById("popup-description");
    const fullscreenOverlay = document.getElementById("fullscreen-overlay");
    const fullscreenImage = document.getElementById("fullscreen-image");
    const fullscreenTitle = document.getElementById("fullscreen-title");
    const fullscreenDescription = document.getElementById("fullscreen-description");
    const fullscreenClose = document.getElementById("fullscreen-close");
    const fullscreenPrev = document.getElementById("fullscreen-prev");
    const fullscreenNext = document.getElementById("fullscreen-next");
    const photoTriggers = Array.from(document.querySelectorAll(".placemark[data-image]"));

    let lastTrigger = null;
    let fullscreenIndex = -1;

    if(debugMode){
      map.addEventListener("click", (event) => {
        if (event.target.closest(".placemark")) return;
        const bounds = map.getBoundingClientRect();
        const left = ((event.clientX - bounds.left) / bounds.width * 100).toFixed(1);
        const top = ((event.clientY - bounds.top) / bounds.height * 100).toFixed(1);
        alert(`left: ${left}%; top: ${top}%;`);
      });
    }

    function updatePopupContent(trigger) {
      popupImageFrame.classList.remove("loading");
      popupImage.removeAttribute("src");
      popupImage.alt = "";
      popupKicker.textContent = "";
      popupTitle.textContent = "";
      popupDescription.textContent = "";

      popupKicker.textContent = trigger.dataset.kicker || "Punto di interesse";
      popupTitle.textContent = trigger.dataset.title || "";
      popupDescription.textContent = trigger.dataset.description || "";
      if (trigger.dataset.image) popupImageFrame.classList.add("loading");
      popupImage.src = trigger.dataset.image || "";
      popupImage.alt = trigger.dataset.title || "Foto";
    }

    function openPopup(trigger) {
      lastTrigger = trigger;
      updatePopupContent(trigger);
      popup.classList.add("open");
      backdrop.classList.add("open");
      closeButton.focus();
    }

    function showPopupPhoto(direction) {
      const currentIndex = photoTriggers.indexOf(lastTrigger);
      if (currentIndex < 0 || photoTriggers.length < 2) return;
      const nextIndex = (currentIndex + direction + photoTriggers.length) % photoTriggers.length;
      lastTrigger = photoTriggers[nextIndex];
      updatePopupContent(lastTrigger);
    }

    popupImage.addEventListener("load", () => {
      popupImageFrame.classList.remove("loading");
    });
    popupImage.addEventListener("error", () => {
      popupImageFrame.classList.remove("loading");
    });

    function closePopup() {
      popup.classList.remove("open");
      backdrop.classList.remove("open");
      if (lastTrigger) lastTrigger.focus();
    }

    function openFullscreen() {
      if (!popupImage.src) return;
      fullscreenIndex = photoTriggers.indexOf(lastTrigger);
      updateFullscreenContent(lastTrigger);
      fullscreenOverlay.classList.add("open");
      fullscreenOverlay.setAttribute("aria-hidden", "false");
    }

    function updateFullscreenContent(trigger) {
      fullscreenImage.src = trigger.dataset.image || "";
      fullscreenImage.alt = trigger.dataset.title || "Foto";
      fullscreenTitle.textContent = trigger.dataset.title || "";
      fullscreenDescription.textContent = trigger.dataset.description || "";
    }

    function showFullscreenPhoto(direction) {
      if (fullscreenIndex < 0 || photoTriggers.length < 2) return;
      fullscreenIndex = (fullscreenIndex + direction + photoTriggers.length) % photoTriggers.length;
      lastTrigger = photoTriggers[fullscreenIndex];
      updatePopupContent(lastTrigger);
      updateFullscreenContent(lastTrigger);
    }

    function closeFullscreen() {
      fullscreenOverlay.classList.remove("open");
      fullscreenOverlay.setAttribute("aria-hidden", "true");
      fullscreenImage.src = "";
      fullscreenImage.alt = "";
      fullscreenTitle.textContent = "";
      fullscreenDescription.textContent = "";
    }

    document.querySelectorAll(".placemark").forEach((trigger) => {
      trigger.addEventListener("click", (event) => {
        event.preventDefault();
        openPopup(trigger);
      });
    });

    popupImage.addEventListener("click", openFullscreen);
    popupPrev.addEventListener("click", () => showPopupPhoto(-1));
    popupNext.addEventListener("click", () => showPopupPhoto(1));
    closeButton.addEventListener("click", closePopup);
    backdrop.addEventListener("click", closePopup);
    fullscreenOverlay.addEventListener("click", (event) => {
      if (event.target === fullscreenOverlay) {
        closeFullscreen();
      }
    });
    fullscreenClose.addEventListener("click", closeFullscreen);
    fullscreenPrev.addEventListener("click", () => showFullscreenPhoto(-1));
    fullscreenNext.addEventListener("click", () => showFullscreenPhoto(1));

    document.addEventListener("keydown", (event) => {
      if (fullscreenOverlay.classList.contains("open")) {
        if (event.key === "ArrowRight") {
          showFullscreenPhoto(1);
          return;
        }
        if (event.key === "ArrowLeft") {
          showFullscreenPhoto(-1);
          return;
        }
      }

      if (event.key === "Escape") {
        if (fullscreenOverlay.classList.contains("open")) {
          closeFullscreen();
          return;
        }
        if (popup.classList.contains("open")) {
          closePopup();
        }
      }
    });
  </script>
</body>
</html>
